name: Deploy product directory to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/pages.yml
      - assets/profile-hero.png
      - pages/**
      - scripts/product-site.ts
      - scripts/products.ts
      - products.json
      - PRODUCTS.md
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate inventory
        run: node scripts/products.ts check

      - name: Build static directory
        run: node scripts/product-site.ts build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
